<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6A4BC4">
  <title>Starbound Hunters</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Starbound Hunters">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="game3d">
  <div id="scene-root"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-top">
      <span class="hud-title">✨ Starbound Hunters</span>
      <span class="hud-pals">🐾 <span id="pal-count">0</span></span>
    </div>
    <div id="hud-hint" class="hud-hint">Tap the ground to explore the district!</div>
  </div>

  <!-- Proximity prompt -->
  <div id="prompt" class="prompt hidden">
    <span id="prompt-text">Station</span>
    <button id="prompt-btn" class="prompt-btn">Go ✨</button>
  </div>

  <!-- Loading veil -->
  <div id="loading" class="loading">
    <div class="loading-star">⭐</div>
    <p>Waking up the magic…</p>
  </div>

  <noscript><p style="color:#fff;padding:20px">Please enable JavaScript to play.</p></noscript>

  <script type="module" src="world3d.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>

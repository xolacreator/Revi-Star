name: Generate Voiceover

# Manually run from the Actions tab. Generates character voice clips with ElevenLabs
# and commits them to assets/vo/. Requires repo secret: ELEVENLABS_API_KEY.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Which voice batch to generate'
        default: 'all'
        type: choice
        options: [all, extra, shop, mission, night, middle, family, digraph, syll, core, tut, letters, words, blend, rhyme, case, last, sight, check]

permissions:
  contents: write

jobs:
  voiceover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate voice clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VO_BATCH: ${{ inputs.batch }}
        run: node tools/voice/generate.mjs

      - name: Commit clips
        if: always()   # commit whatever was generated, even if the run stopped early (e.g. quota)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/vo
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate character voice clips (ElevenLabs)"
            git push origin HEAD:${{ github.ref_name }}
          fi

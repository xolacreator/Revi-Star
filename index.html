<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7F77DD">
  <title>Doodle Stars</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Doodle Stars">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- ---------- Home / world picker ---------- -->
    <section id="home" class="screen active">
      <button id="open-stickers" class="icon-btn corner-btn" aria-label="My sticker book">📖</button>
      <h1 class="logo">Doodle Stars</h1>
      <p class="tagline">Pick a world to play!</p>
      <div class="world-grid">
        <button class="world-card world-pop" data-world="pop">
          <span class="world-emoji">🎤</span>
          <span class="world-name">Pop Star</span>
        </button>
        <button class="world-card world-frost" data-world="frost">
          <span class="world-emoji">❄️</span>
          <span class="world-name">Frosty</span>
        </button>
      </div>
      <div class="home-stars">⭐ <span id="home-star-count">0</span></div>
    </section>

    <!-- ---------- Play screen ---------- -->
    <section id="play" class="screen">
      <div class="play-bar">
        <button id="back" class="icon-btn" aria-label="Back to worlds">🏠</button>
        <span id="world-title" class="world-title">Pop Star</span>
        <button id="star-chip" class="star-chip" aria-label="Stars earned">⭐ <span id="star-count">0</span></button>
        <button id="mode-toggle" class="pill-btn">Dress up</button>
      </div>

      <div id="stage-wrap">
        <canvas id="stage" width="360" height="360"></canvas>
        <div id="dressup-layer" class="hidden"></div>
        <canvas id="fx" width="360" height="360" aria-hidden="true"></canvas>
      </div>

      <div id="toolbar"></div>
    </section>

    <!-- ---------- Sticker book ---------- -->
    <section id="stickerbook" class="screen">
      <div class="play-bar">
        <button id="stickers-back" class="icon-btn" aria-label="Back home">🏠</button>
        <span class="world-title">My Stickers</span>
        <span class="star-chip">⭐ <span id="book-star-count">0</span></span>
      </div>
      <div id="sticker-grid" class="sticker-grid"></div>
    </section>

  </div>

  <!-- reward toasts + confetti host -->
  <div id="toast-host" aria-live="polite"></div>

  <script src="characters.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
